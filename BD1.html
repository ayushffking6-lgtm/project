<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BD 3rd Page</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    overflow:hidden;
    height:100vh;

    background:linear-gradient(
        135deg,
        #000000,
        #140000,
        #2b0000,
        #4d0000
    );

    position:relative;
}

/* BACKGROUND GLOW */

body::before{

    content:"";

    position:absolute;

    width:900px;
    height:900px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:radial-gradient(
        rgba(255,0,0,0.12),
        transparent 70%
    );

    animation:bgPulse 5s infinite ease-in-out;
}

@keyframes bgPulse{

    0%{

        transform:
            translate(-50%,-50%)
            scale(1);

        opacity:0.4;
    }

    50%{

        transform:
            translate(-50%,-50%)
            scale(1.15);

        opacity:1;
    }

    100%{

        transform:
            translate(-50%,-50%)
            scale(1);

        opacity:0.4;
    }
}

/* TITLE */

.title{

    position:absolute;

    top:4%;
    width:100%;

    text-align:center;

    color:#ff4d4d;

    font-size:52px;

    font-family:cursive;

    letter-spacing:3px;

    z-index:100;

    text-shadow:
        0 0 10px #ff0000,
        0 0 30px #ff1a1a,
        0 0 80px #ff4d4d;

    animation:titleGlow 2s infinite alternate;
}

@keyframes titleGlow{

    0%{

        text-shadow:
            0 0 10px #ff0000,
            0 0 30px #ff1a1a,
            0 0 80px #ff4d4d;
    }

    100%{

        text-shadow:
            0 0 20px #ff6666,
            0 0 50px #ff1a1a,
            0 0 100px #ff0000;
    }
}

/* FLOATING PARTICLES */

.particle{

    position:absolute;

    bottom:-50px;

    border-radius:50%;

    background:red;

    opacity:0.5;

    animation:floatParticle linear infinite;
}

@keyframes floatParticle{

    0%{

        transform:
            translateY(0)
            scale(0.5);

        opacity:0;
    }

    10%{
        opacity:1;
    }

    100%{

        transform:
            translateY(-120vh)
            scale(1.8);

        opacity:0;
    }
}

/* CANVAS */

canvas{

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:100%;
}

/* BOTTOM TEXT */

.bottom-text{

    position:absolute;

    bottom:4%;

    width:100%;

    text-align:center;

    color:#ff9999;

    font-size:26px;

    font-family:cursive;

    letter-spacing:2px;

    z-index:100;

    text-shadow:
        0 0 10px #ff0000,
        0 0 25px #ff4d4d;

    animation:fadeText 3s infinite alternate;
}

@keyframes fadeText{

    0%{
        opacity:0.6;
    }

    100%{
        opacity:1;
    }
}

</style>
</head>

<body>

<!-- TITLE -->

<h1 class="title">
    Wishing You A Very Happy Birthday! ❤️
</h1>

<!-- FLOAT PARTICLES -->

<div class="particle" style="left:2%; width:8px; height:8px; animation-duration:7s;"></div>
<div class="particle" style="left:8%; width:12px; height:12px; animation-duration:9s;"></div>
<div class="particle" style="left:14%; width:10px; height:10px; animation-duration:6s;"></div>
<div class="particle" style="left:20%; width:14px; height:14px; animation-duration:8s;"></div>
<div class="particle" style="left:26%; width:9px; height:9px; animation-duration:7s;"></div>
<div class="particle" style="left:32%; width:13px; height:13px; animation-duration:10s;"></div>
<div class="particle" style="left:38%; width:8px; height:8px; animation-duration:6s;"></div>
<div class="particle" style="left:44%; width:12px; height:12px; animation-duration:9s;"></div>
<div class="particle" style="left:50%; width:10px; height:10px; animation-duration:8s;"></div>
<div class="particle" style="left:56%; width:14px; height:14px; animation-duration:7s;"></div>
<div class="particle" style="left:62%; width:9px; height:9px; animation-duration:6s;"></div>
<div class="particle" style="left:68%; width:13px; height:13px; animation-duration:9s;"></div>
<div class="particle" style="left:74%; width:8px; height:8px; animation-duration:7s;"></div>
<div class="particle" style="left:80%; width:12px; height:12px; animation-duration:10s;"></div>
<div class="particle" style="left:86%; width:10px; height:10px; animation-duration:8s;"></div>
<div class="particle" style="left:92%; width:14px; height:14px; animation-duration:7s;"></div>

<!-- CANVAS -->

<canvas id="treeCanvas"></canvas>

<!-- BOTTOM TEXT -->

<div class="bottom-text">
    Growing Like Love... Branch By Branch ❤️
</div>

<script>

const canvas =
    document.getElementById("treeCanvas");

const ctx =
    canvas.getContext("2d");

canvas.width =
    window.innerWidth;

canvas.height =
    window.innerHeight;

/* DRAW ANIMATED TREE */

function drawBranch(x, y, len, angle, width){

    if(len < 10){

        ctx.beginPath();

        ctx.fillStyle = "#ff4d4d";

        ctx.shadowBlur = 25;

        ctx.shadowColor = "red";

        ctx.arc(x, y, 5, 0, Math.PI * 2);

        ctx.fill();

        return;
    }

    let x2 =
        x + len * Math.cos(angle * Math.PI / 180);

    let y2 =
        y - len * Math.sin(angle * Math.PI / 180);

    let progress = 0;

    function animateLine(){

        progress += 0.02;

        let currentX =
            x + (x2 - x) * progress;

        let currentY =
            y + (y2 - y) * progress;

        ctx.beginPath();

        ctx.strokeStyle =
            `rgb(${120 + len},0,0)`;

        ctx.shadowBlur = 15;

        ctx.shadowColor = "red";

        ctx.lineWidth = width;

        ctx.lineCap = "round";

        ctx.moveTo(x,y);

        ctx.lineTo(currentX,currentY);

        ctx.stroke();

        if(progress < 1){

            requestAnimationFrame(animateLine);
        }

        else{

            setTimeout(() => {

                drawBranch(
                    x2,
                    y2,
                    len * 0.72,
                    angle - 28,
                    width * 0.72
                );

                drawBranch(
                    x2,
                    y2,
                    len * 0.72,
                    angle + 28,
                    width * 0.72
                );

            },80);
        }
    }

    animateLine();
}

/* START TREE */

drawBranch(
    canvas.width / 2,
    canvas.height,
    120,
    90,
    12
);

</script>

</body>
</html>
