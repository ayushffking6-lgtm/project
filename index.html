<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Wishbook</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins",sans-serif;
}

body{
    height:100vh;
    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(
        135deg,
        #ffb6c1,
        #ff758c,
        #ff4d6d,
        #ff1744
    );

    position:relative;
}

/* BIG HEART BACKGROUND */

.big-heart{
    position:absolute;

    width:420px;
    height:420px;

    background:#ff003c;

    transform:rotate(-45deg);

    opacity:0.18;

    z-index:0;

    animation:heartbeat 1.5s infinite ease-in-out;

    box-shadow:
        0 0 50px #ff003c,
        0 0 100px #ff4d6d,
        0 0 150px #ff85a2;
}

.big-heart::before,
.big-heart::after{
    content:"";

    position:absolute;

    width:420px;
    height:420px;

    background:#ff003c;

    border-radius:50%;
}

.big-heart::before{
    top:-210px;
    left:0;
}

.big-heart::after{
    left:210px;
    top:0;
}

@keyframes heartbeat{

    0%{
        transform:rotate(-45deg) scale(1);
    }

    25%{
        transform:rotate(-45deg) scale(1.08);
    }

    40%{
        transform:rotate(-45deg) scale(0.96);
    }

    60%{
        transform:rotate(-45deg) scale(1.12);
    }

    100%{
        transform:rotate(-45deg) scale(1);
    }
}



.heart{
    position:absolute;

    bottom:-100px;

    color:rgba(255,255,255,0.8);

    animation:floatUp linear infinite;

    z-index:1;
}

@keyframes floatUp{

    0%{
        transform:translateY(0) scale(0.8);
        opacity:0;
    }

    10%{
        opacity:1;
    }

    100%{
        transform:translateY(-120vh) scale(1.8);
        opacity:0;
    }
}

/* KISS EMOJIS */

.kiss{
    position:absolute;

    left:-100px;

    animation:moveRight linear infinite;

    z-index:1;
}

@keyframes moveRight{

    0%{
        transform:translateX(0);
        opacity:0;
    }

    10%{
        opacity:1;
    }

    100%{
        transform:translateX(130vw);
        opacity:0;
    }
}

/* MAIN CONTENT */

.container{
    position:relative;
    z-index:10;
    text-align:center;
}

/* HEART FRAME */

.heart-frame{

    width:320px;
    height:320px;

    position:relative;

    margin:auto;

    transform:rotate(-45deg);

    overflow:hidden;

    animation:imgBeat 2s infinite ease-in-out;

    box-shadow:
        0 0 30px rgba(255,255,255,0.5),
        0 0 80px rgba(255,0,80,0.7);
}

.heart-frame::before,
.heart-frame::after{

    content:"";

    position:absolute;

    width:320px;
    height:320px;

    background:inherit;

    border-radius:50%;
}

.heart-frame::before{
    top:-160px;
    left:0;
}

.heart-frame::after{
    left:160px;
    top:0;
}

.birthday-img{

    width:100%;
    height:100%;

    object-fit:cover;

    transform:rotate(45deg) scale(1.15);
}

/* IMAGE HEART BEAT */

@keyframes imgBeat{

    0%{
        transform:rotate(-45deg) scale(1);
    }

    50%{
        transform:rotate(-45deg) scale(1.05);
    }

    100%{
        transform:rotate(-45deg) scale(1);
    }
}

/* BUTTON */

.btn{
    margin-top:60px;

    padding:16px 40px;

    border:none;
    border-radius:50px;

    font-size:20px;
    font-weight:600;

    cursor:pointer;

    color:white;

    background:rgba(255,255,255,0.15);

    backdrop-filter:blur(10px);

    border:2px solid rgba(255,255,255,0.3);

    transition:0.35s ease;

    box-shadow:
        0 0 20px rgba(255,255,255,0.2);
}

.btn:hover{

    transform:scale(1.1);

    background:white;

    color:#ff2e63;

    box-shadow:
        0 0 25px white,
        0 0 50px #ff4d6d;
}

/* CONFETTI */

.confetti{
    position:absolute;

    border-radius:20px;

    pointer-events:none;

    z-index:999;

    opacity:0;

    animation:confettiBlast 3s linear forwards;
}

.confetti.curve{

    border-radius:50%;

    transform:rotate(25deg);
}

@keyframes confettiBlast{

    0%{
        transform:
            translate(0,0)
            rotate(0deg)
            scale(0);

        opacity:1;
    }

    20%{
        opacity:1;
    }

    100%{
        transform:
            translate(var(--x),var(--y))
            rotate(720deg)
            scale(1);

        opacity:0;
    }
}

</style>
</head>

<body>



<div class="big-heart"></div>



<div class="heart" style="left:2%; font-size:18px; animation-duration:6s;">❤</div>
<div class="heart" style="left:8%; font-size:28px; animation-duration:8s;">💖</div>
<div class="heart" style="left:14%; font-size:22px; animation-duration:7s;">💕</div>
<div class="heart" style="left:20%; font-size:30px; animation-duration:10s;">💘</div>
<div class="heart" style="left:28%; font-size:24px; animation-duration:9s;">❤</div>
<div class="heart" style="left:35%; font-size:20px; animation-duration:11s;">💗</div>
<div class="heart" style="left:42%; font-size:26px; animation-duration:7s;">💖</div>
<div class="heart" style="left:50%; font-size:18px; animation-duration:8s;">💕</div>
<div class="heart" style="left:58%; font-size:32px; animation-duration:10s;">❤</div>
<div class="heart" style="left:65%; font-size:25px; animation-duration:7s;">💘</div>
<div class="heart" style="left:72%; font-size:20px; animation-duration:9s;">💖</div>
<div class="heart" style="left:80%; font-size:28px; animation-duration:11s;">💕</div>
<div class="heart" style="left:88%; font-size:24px; animation-duration:8s;">❤</div>
<div class="heart" style="left:95%; font-size:30px; animation-duration:6s;">💗</div>

<!-- KISS EMOJIS -->

<div class="kiss" style="top:5%; font-size:28px; animation-duration:12s;">😘</div>
<div class="kiss" style="top:15%; font-size:34px; animation-duration:10s;">💋</div>
<div class="kiss" style="top:25%; font-size:24px; animation-duration:14s;">😘</div>
<div class="kiss" style="top:35%; font-size:32px; animation-duration:11s;">💋</div>
<div class="kiss" style="top:45%; font-size:26px; animation-duration:13s;">😘</div>
<div class="kiss" style="top:55%; font-size:36px; animation-duration:10s;">💋</div>
<div class="kiss" style="top:65%; font-size:24px; animation-duration:15s;">😘</div>
<div class="kiss" style="top:75%; font-size:30px; animation-duration:11s;">💋</div>
<div class="kiss" style="top:85%; font-size:26px; animation-duration:13s;">😘</div>

<!-- MAIN CONTENT -->

<div class="container">

    <div class="heart-frame">

        <img src="AYUSH_BD.jpeg" alt="Birthday Image" class="birthday-img">

    </div>

    <button class="btn" onclick="openWish()">
        ME≽^•⩊•^≼OW
    </button>

</div>

<script>

function openWish(){

    let button = document.querySelector(".btn");

    /* BUTTON CLICK */

    button.style.transform = "scale(0.88)";

    setTimeout(() => {

        button.style.transform = "scale(1.1)";

    },150);

    

    for(let i = 0; i < 700; i++){

        let confetti = document.createElement("div");

        confetti.classList.add("confetti");

        /* RANDOM SHAPES */

        if(Math.random() > 0.45){

            confetti.classList.add("curve");
        }

        

        let colors = [

            "#FFD700",
            "#FF69B4",
            "#FFFFFF",
            "#FF1493",
            "#FFC0CB",
            "#ffcc00",
            "#ff4d6d",
            "#fff0f5"

        ];

        confetti.style.background =
            colors[Math.floor(Math.random() * colors.length)];

        /* START POSITION */

        let rect = button.getBoundingClientRect();

        confetti.style.left =
            rect.left + rect.width / 2 + "px";

        confetti.style.top =
            rect.top + rect.height / 2 + "px";

        /* FULL SCREEN EXPLOSION */

        let randomX =
            (Math.random() - 0.5) * window.innerWidth * 4;

        let randomY =
            (Math.random() - 0.5) * window.innerHeight * 4;

        confetti.style.setProperty(
            "--x",
            randomX + "px"
        );

        confetti.style.setProperty(
            "--y",
            randomY + "px"
        );


        confetti.style.width =
            Math.random() * 22 + 10 + "px";

        confetti.style.height =
            Math.random() * 60 + 25 + "px";

        

        confetti.style.transform =
            `rotate(${Math.random() * 360}deg)`;

        

        confetti.style.animationDuration =
            Math.random() * 2 + 2 + "s";

        document.body.appendChild(confetti);

        

        setTimeout(() => {

            confetti.remove();

        },5000);
    }

    

    setTimeout(() => {

        window.location.href = "BD_2nd.html";

    },4200);
}

</script>

</body>
</html>
