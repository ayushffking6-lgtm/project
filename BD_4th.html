<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Mela Bbu 💖</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:"Poppins",sans-serif;

    height:100vh;

    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;

    background:black;
}

/* =========================
   BACKGROUND IMAGE
========================= */

.bg-image{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    opacity:.22;

    filter:
    blur(3px)
    brightness(.6);

    transform:scale(1.05);

    z-index:0;
}

/* =========================
   OVERLAY
========================= */

.overlay{

    position:absolute;

    inset:0;

    background:
    linear-gradient(
        135deg,
        rgba(0,0,0,.75),
        rgba(20,0,30,.55)
    );

    z-index:1;
}

/* =========================
   CONTAINER
========================= */

.container{

    position:relative;

    z-index:10;

    width:90%;
    max-width:850px;

    padding:50px 35px;

    border-radius:35px;

    text-align:center;

    background:
    rgba(255,255,255,.08);

    backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,.12);

    box-shadow:
    0 0 25px rgba(255,20,147,.18),
    0 0 60px rgba(138,43,226,.15);

    animation:
    containerFloat 5s ease-in-out infinite;
}

@keyframes containerFloat{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-8px);
    }

    100%{
        transform:translateY(0px);
    }
}

/* =========================
   HEADING
========================= */

h1{

    font-size:4.5rem;

    line-height:1.2;

    color:#fff;

    font-family:"Great Vibes",cursive;

    text-shadow:
    0 0 10px #fff,
    0 0 25px #ff4da6,
    0 0 45px #ff1493;

    opacity:0;

    animation:
    headingPop 1.5s forwards .5s;
}

@keyframes headingPop{

    0%{

        opacity:0;

        transform:
        scale(.4)
        rotate(-10deg);
    }

    60%{

        opacity:1;

        transform:
        scale(1.08)
        rotate(3deg);
    }

    100%{

        opacity:1;

        transform:
        scale(1)
        rotate(0deg);
    }
}

/* =========================
   SUBTITLE
========================= */

.subtitle{

    margin-top:25px;

    font-size:1.3rem;

    color:#f8dfff;

    line-height:1.9;

    font-weight:300;

    opacity:0;

    animation:
    fadeUp 1.5s forwards 1.8s;
}

@keyframes fadeUp{

    from{

        opacity:0;

        transform:translateY(40px);
    }

    to{

        opacity:1;

        transform:translateY(0px);
    }
}

/* =========================
   BUTTON
========================= */

.next-button{

    margin-top:40px;

    padding:18px 42px;

    border:none;

    border-radius:60px;

    font-size:1.2rem;

    font-weight:700;

    letter-spacing:1px;

    cursor:pointer;

    color:white;

    background:
    linear-gradient(
        135deg,
        #ff4da6,
        #8A2BE2
    );

    box-shadow:
    0 0 15px #ff1493,
    0 0 35px rgba(138,43,226,.5);

    transition:.35s ease;

    opacity:0;

    animation:
    fadeUp 1s forwards 2.8s;
}

.next-button:hover{

    transform:
    scale(1.08)
    translateY(-4px);

    box-shadow:
    0 0 25px #ff1493,
    0 0 50px rgba(138,43,226,.8);
}

/* =========================
   AUDIO CONTROLS
========================= */

.audio-controls{

    position:fixed;

    right:20px;
    bottom:20px;

    z-index:100;

    display:flex;
    align-items:center;
    gap:10px;

    padding:10px 16px;

    border-radius:50px;

    background:
    rgba(255,255,255,.12);

    backdrop-filter:blur(8px);

    border:1px solid rgba(255,255,255,.15);
}

.audio-controls button{

    border:none;

    background:none;

    font-size:1.5rem;

    cursor:pointer;

    color:white;
}

.audio-controls input{

    width:90px;
}

/* =========================
   FLOATING ELEMENTS
========================= */

.float{

    position:absolute;

    font-size:25px;

    animation:
    floatUp linear infinite;

    opacity:.8;

    z-index:2;
}

@keyframes floatUp{

    0%{

        transform:
        translateY(100vh)
        scale(.6);

        opacity:0;
    }

    10%{
        opacity:1;
    }

    100%{

        transform:
        translateY(-120vh)
        scale(1.4);

        opacity:0;
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

    .container{

        padding:35px 20px;
    }

    h1{

        font-size:3rem;
    }

    .subtitle{

        font-size:1rem;

        line-height:1.8;
    }

    .next-button{

        padding:14px 30px;

        font-size:1rem;
    }
}

@media(max-width:480px){

    h1{

        font-size:2.4rem;
    }

    .subtitle{

        font-size:.92rem;
    }

    .audio-controls{

        right:10px;
        bottom:10px;

        padding:8px 12px;
    }
}

</style>

</head>

<body>

<!-- BACKGROUND IMAGE -->

<img
src="bg.jpeg"
class="bg-image"
>

<div class="overlay"></div>

<!-- FLOATING EMOJIS -->

<div class="float" style="left:5%;animation-duration:8s;">💖</div>
<div class="float" style="left:18%;animation-duration:10s;">✨</div>
<div class="float" style="left:32%;animation-duration:7s;">🎈</div>
<div class="float" style="left:48%;animation-duration:11s;">💕</div>
<div class="float" style="left:62%;animation-duration:9s;">🌸</div>
<div class="float" style="left:76%;animation-duration:8s;">🎂</div>
<div class="float" style="left:90%;animation-duration:12s;">💫</div>

<!-- MAIN CONTAINER -->

<div class="container">

    <h1>
        Happy Birthday <br>
        Mela Bbu 💖
    </h1>

    <div class="subtitle">

        Hey Love 🥺✨<br><br>

        Aaj ka din sirf tumhare liye hai 💕<br>
        Ready ho jao ek cute si magical journey ke liye 🌸💫

    </div>

    <button
    class="next-button"
    onclick="goToNextPage()">

        Let's Go ✨

    </button>

</div>

<!-- AUDIO -->

<div class="audio-controls">

    <button id="play-pause">
        ▶️
    </button>

    <input
    type="range"
    id="volume"
    min="0"
    max="1"
    step="0.1"
    value="0.5">

</div>

<audio
id="birthday-song"
loop>

<source
src="Love You Oye - Prabh Gill.mp3"
type="audio/mp3">

</audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>

<script>

/* =========================
   AUDIO
========================= */

const audio =
document.getElementById(
"birthday-song"
);

const playPauseBtn =
document.getElementById(
"play-pause"
);

const volumeControl =
document.getElementById(
"volume"
);

let isPlaying = false;

audio.volume =
volumeControl.value;

window.addEventListener(
"load",
()=>{

setTimeout(()=>{

audio.play()

.then(()=>{

isPlaying = true;

playPauseBtn.innerHTML =
"⏸️";

})

.catch(()=>{});

},1000);

});

/* PLAY PAUSE */

playPauseBtn.addEventListener(
"click",
()=>{

if(isPlaying){

audio.pause();

playPauseBtn.innerHTML =
"▶️";

}else{

audio.play();

playPauseBtn.innerHTML =
"⏸️";
}

isPlaying = !isPlaying;

});

/* VOLUME */

volumeControl.addEventListener(
"input",
()=>{

audio.volume =
volumeControl.value;

});

/* =========================
   NEXT PAGE
========================= */

function goToNextPage(){

gsap.to(
".next-button",
{

scale:1.15,

duration:.3,

yoyo:true,

repeat:1,

onComplete:()=>{

window.location.href =
"memorylane.html";

}

});

}

/* =========================
   EXTRA GLOW
========================= */

gsap.to(
"h1",
{

textShadow:
"0 0 15px #fff, 0 0 35px #ff4da6, 0 0 60px #ff1493",

repeat:-1,

yoyo:true,

duration:2

});

</script>

</body>
</html>
