<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Magical Birthday Cake</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:"Arial Rounded MT Bold", Arial, sans-serif;
    }

    body{
      min-height:100vh;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;

      /* BACKGROUND IMAGE */
      background:
        linear-gradient(
          rgba(0,0,0,0.35),
          rgba(0,0,0,0.35)
        ),
        url("1.jpeg");

      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
      background-attachment:fixed;
    }

    /* Blur Overlay */
    body::before{
      content:"";
      position:absolute;
      inset:0;
      background:rgba(255,255,255,0.05);
      backdrop-filter:blur(3px);
      z-index:0;
    }

    /* Floating Balloons */
    .balloon{
      position:absolute;
      width:40px;
      height:50px;
      border-radius:50%;
      animation:float 15s infinite ease-in-out;
      z-index:1;
      opacity:0.8;
    }

    @keyframes float{
      0%{
        transform:translateY(100vh) translateX(0);
        opacity:1;
      }
      100%{
        transform:translateY(-100px) translateX(50px);
        opacity:0;
      }
    }

    /* Confetti */
    .confetti{
      position:absolute;
      width:10px;
      height:10px;
      opacity:0;
      animation:confettiFall 5s infinite ease-out;
      z-index:1;
    }

    @keyframes confettiFall{
      0%{
        transform:translateY(-10vh) rotate(0deg);
        opacity:1;
      }
      100%{
        transform:translateY(100vh) rotate(720deg);
        opacity:0;
      }
    }

    /* Cake Container */
    .cake-container{
      position:relative;
      width:300px;
      height:300px;
      z-index:10;
    }

    .cake{
      position:absolute;
      bottom:0;
      left:50%;
      transform:translateX(-50%);
      width:200px;
      height:120px;
      background:linear-gradient(to right,#ff85a2,#ff99b6);
      border-radius:10px 10px 0 0;
      box-shadow:0 10px 25px rgba(0,0,0,0.25);
    }

    .cake:before{
      content:"";
      position:absolute;
      top:-40px;
      left:0;
      width:100%;
      height:40px;
      background:linear-gradient(to right,#fc6c85,#ff85a2);
      border-radius:10px 10px 0 0;
    }

    .cake:after{
      content:"";
      position:absolute;
      top:-70px;
      left:10%;
      width:80%;
      height:30px;
      background:linear-gradient(to right,#ffb3c6,#ffcce6);
      border-radius:10px 10px 0 0;
    }

    /* Frosting */
    .frosting{
      position:absolute;
      top:-75px;
      left:15%;
      width:70%;
      height:5px;
      background:white;
      border-radius:5px;
      box-shadow:0 0 10px #fff;
    }

    /* Decorations */
    .decoration{
      position:absolute;
      width:10px;
      height:10px;
      border-radius:50%;
      box-shadow:0 0 5px rgba(255,255,255,0.6);
    }

    /* Candles */
    .candle-container{
      position:absolute;
      top:-95px;
      left:0;
      width:100%;
      display:flex;
      justify-content:center;
      gap:20px;
      z-index:20;
    }

    .candle{
      position:relative;
      width:8px;
      height:30px;
      background:linear-gradient(to top,#ffff99,#ff9933);
      border-radius:4px;
      cursor:pointer;
    }

    .flame{
      position:absolute;
      top:-20px;
      left:50%;
      transform:translateX(-50%);
      width:12px;
      height:20px;
      background:radial-gradient(circle,#ffff00,#ff9900,#ff6600);
      border-radius:50% 50% 20% 20%;
      box-shadow:0 0 10px #ff9900,0 0 20px #ffff00;
      animation:flicker 0.5s infinite alternate;
    }

    @keyframes flicker{
      from{
        transform:translateX(-50%) scale(1);
      }
      to{
        transform:translateX(-50%) scale(1.1);
      }
    }

    .candle.blown .flame{
      opacity:0;
    }

    .smoke{
      position:absolute;
      top:-25px;
      left:50%;
      transform:translateX(-50%);
      width:8px;
      height:0;
      background:rgba(200,200,200,0.5);
      border-radius:10px;
      opacity:0;
    }

    .candle.blown .smoke{
      height:30px;
      opacity:0.7;
      animation:smokeRise 2s forwards;
    }

    @keyframes smokeRise{
      0%{
        opacity:0.7;
      }
      100%{
        opacity:0;
        transform:translateX(-50%) translateY(-30px) scale(1.5);
      }
    }

    /* Wish Message */
    .wish-message{
      position:fixed;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%) scale(0);
      background:rgba(255,255,255,0.95);
      padding:25px;
      border-radius:20px;
      text-align:center;
      z-index:100;
      opacity:0;
      width:90%;
      max-width:400px;
      transition:0.5s;
      box-shadow:0 10px 30px rgba(255,105,180,0.5);
    }

    .wish-message.show{
      transform:translate(-50%,-50%) scale(1);
      opacity:1;
    }

    .wish-message h2{
      color:#ff3366;
      margin-bottom:15px;
      font-size:28px;
    }

    .wish-message p{
      font-size:18px;
      line-height:1.5;
      color:#333;
    }

    /* Buttons */
    .nav-buttons{
      position:fixed;
      bottom:30px;
      width:100%;
      display:flex;
      justify-content:space-between;
      padding:0 40px;
      z-index:50;
    }

    .btn{
      padding:12px 24px;
      border:none;
      border-radius:30px;
      background:linear-gradient(to right,#ff85a2,#ff3366);
      color:white;
      cursor:pointer;
      font-size:16px;
      box-shadow:0 5px 15px rgba(255,51,102,0.4);
      transition:0.3s;
    }

    .btn:hover{
      transform:translateY(-3px);
    }

    @media(max-width:768px){
      .cake-container{
        width:250px;
        height:250px;
      }

      .cake{
        width:160px;
        height:90px;
      }

      .nav-buttons{
        padding:0 20px;
      }

      .btn{
        font-size:14px;
        padding:10px 18px;
      }
    }

  </style>
</head>

<body>

  <!-- Cake -->
  <div class="cake-container">

    <div class="cake">

      <!-- Candles -->
      <div class="candle-container">

        <div class="candle">
          <div class="flame"></div>
          <div class="smoke"></div>
        </div>

        <div class="candle">
          <div class="flame"></div>
          <div class="smoke"></div>
        </div>

        <div class="candle">
          <div class="flame"></div>
          <div class="smoke"></div>
        </div>

        <div class="candle">
          <div class="flame"></div>
          <div class="smoke"></div>
        </div>

        <div class="candle">
          <div class="flame"></div>
          <div class="smoke"></div>
        </div>

      </div>

      <div class="frosting"></div>

    </div>
  </div>

  <!-- Wish Popup -->
  <div class="wish-message" id="wishMessage">

    <h2>✨ Happy Birthday Bubu ✨</h2>

    <p>
      May your smile always stay this cute and
      may every dream of yours come true ❤️🎂
    </p>

    <br>

    <button class="btn" onclick="closeWishMessage()">
      Thank You ❤️
    </button>

  </div>

  <!-- Navigation -->
  <div class="nav-buttons">

    <button class="btn" onclick="goBack()">
      ◀ Back
    </button>

    <button class="btn" onclick="goNext()">
      Next Surprise ▶
    </button>

  </div>

  <script>

    let candlesBlown = 0;
    const totalCandles = 5;

    // Candle Blow Logic
    document.querySelectorAll(".candle").forEach((candle) => {

      candle.addEventListener("click", function(){

        if(!this.classList.contains("blown")){

          this.classList.add("blown");
          candlesBlown++;

          if(candlesBlown === totalCandles){

            setTimeout(() => {

              document
                .getElementById("wishMessage")
                .classList.add("show");

            }, 800);

          }

        }

      });

    });

    // Create Balloons
    function createBalloons(){

      const colors = [
        "#ff66b3",
        "#66ccff",
        "#ff9966",
        "#99ff66",
        "#cc99ff"
      ];

      for(let i=0; i<15; i++){

        const balloon = document.createElement("div");

        balloon.className = "balloon";

        balloon.style.background =
          colors[Math.floor(Math.random()*colors.length)];

        balloon.style.left = Math.random()*100 + "%";

        balloon.style.animationDuration =
          10 + Math.random()*10 + "s";

        document.body.appendChild(balloon);

      }

    }

    createBalloons();

    // Create Confetti
    function createConfetti(){

      const colors = [
        "#ffcc00",
        "#ff66b3",
        "#66ccff",
        "#ff9966",
        "#99ff66"
      ];

      for(let i=0; i<50; i++){

        const confetti = document.createElement("div");

        confetti.className = "confetti";

        confetti.style.left = Math.random()*100 + "%";

        confetti.style.background =
          colors[Math.floor(Math.random()*colors.length)];

        confetti.style.animationDuration =
          3 + Math.random()*4 + "s";

        document.body.appendChild(confetti);

      }

    }

    createConfetti();

    // Close Popup
    function closeWishMessage(){

      document
        .getElementById("wishMessage")
        .classList.remove("show");

    }

    // Navigation
    function goBack(){

      window.location.href = "memorylane.html";

    }

    function goNext(){

      window.location.href = "letter.html";

    }

  </script>

</body>
</html>
