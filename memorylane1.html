<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Lane - Birthday Memories</title>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap");

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      isolation: isolate;
      color: #ffeaf1;
      background:
        linear-gradient(120deg, rgba(24, 0, 10, 0.88), rgba(69, 0, 24, 0.68)),
        linear-gradient(135deg, #24000d 0%, #64001f 42%, #b5002c 72%, #ff3d59 100%);
      background-attachment: fixed;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -4;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 8%, rgba(255, 206, 222, 0.18), transparent 34%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 35%, rgba(21, 0, 8, 0.32));
    }

    .scrapbook-bg {
      position: fixed;
      inset: 0;
      z-index: -3;
      opacity: 0.45;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.92), rgba(0, 0, 0, 0.2));
    }

    .fireworks-canvas {
      position: fixed;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .confetti {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }

    .confetti-piece {
      position: absolute;
      top: -20px;
      opacity: 0;
    }

    .memory-lane-container {
      width: min(1200px, 100%);
      margin: 0 auto;
      padding: clamp(1.25rem, 4vw, 3rem) 2rem 2rem;
      position: relative;
      z-index: 1;
    }

    .header {
      text-align: center;
      margin: 0 auto 2rem;
      max-width: 860px;
      padding: clamp(1rem, 3vw, 1.75rem);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      background: rgba(54, 0, 22, 0.48);
      box-shadow:
        0 24px 80px rgba(20, 0, 8, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(14px);
      animation: headerGlow 4s ease-in-out infinite;
    }

    .header h1 {
      font-size: clamp(2.1rem, 8vw, 3.5rem);
      color: #fff5f7;
      margin-bottom: 1rem;
      font-family: "Pacifico", cursive;
      text-shadow:
        0 0 16px rgba(255, 79, 119, 0.85),
        0 0 36px rgba(255, 28, 74, 0.58),
        3px 3px 0 rgba(106, 0, 34, 0.72);
      animation: heartbeat 1.5s ease-in-out infinite;
    }

    .header p {
      max-width: 700px;
      margin: 0 auto;
      padding: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      color: #ffe6ee;
      font-size: 1.08rem;
      line-height: 1.6;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 12px 34px rgba(54, 0, 22, 0.25);
    }

    .slideshow-controls,
    .navigation-buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
    }

    .slideshow-controls {
      margin-bottom: 1.5rem;
      animation: fadeIn 0.8s ease forwards;
    }

    .btn,
    .nav-btn {
      min-height: 48px;
      padding: 0.8rem 1.4rem;
      border: 0;
      border-radius: 999px;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      letter-spacing: 0;
      box-shadow: 0 12px 32px rgba(255, 30, 74, 0.28);
    }

    .btn {
      background: linear-gradient(135deg, #ff1f64, #b9002d 48%, #6f001f);
      border: 1px solid rgba(255, 255, 255, 0.24);
    }

    .nav-btn:hover,
    .btn:hover {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 16px 34px rgba(255, 54, 89, 0.42);
    }

    #backButton {
      background: linear-gradient(135deg, #6d001f, #c10035);
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

    #nextButton {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #ff1f57, #d00032 52%, #ff7a76);
      animation: pulse 2s infinite;
    }

    #nextButton::before {
      content: "";
      position: absolute;
      inset: -50%;
      background: rgba(255, 255, 255, 0.2);
      transform: rotate(45deg);
      animation: shine 3s infinite;
    }

    .gallery-container {
      margin: 1rem 0 3rem;
      padding: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 26px;
      background: rgba(23, 0, 10, 0.28);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
    }

    .gallery {
      display: flex;
      gap: 1.5rem;
      overflow-x: auto;
      padding: 1.7rem 0;
      scroll-behavior: smooth;
      scroll-snap-type: x mandatory;
      scrollbar-width: thin;
      scrollbar-color: #ff355d rgba(255, 255, 255, 0.12);
      -webkit-overflow-scrolling: touch;
    }

    .gallery::-webkit-scrollbar {
      height: 8px;
    }

    .gallery::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 10px;
    }

    .gallery::-webkit-scrollbar-thumb {
      background: #ff355d;
      border-radius: 10px;
    }

    .memory-card {
      flex: 0 0 auto;
      width: 300px;
      height: 400px;
      position: relative;
      overflow: hidden;
      scroll-snap-align: center;
      border: 8px solid rgba(255, 246, 248, 0.95);
      border-radius: 24px;
      box-shadow:
        0 24px 50px rgba(22, 0, 9, 0.45),
        0 0 0 1px rgba(255, 82, 118, 0.18);
      transform: translateY(48px) rotate(var(--rotate, 0deg));
      opacity: 0;
      transition: transform 0.65s cubic-bezier(0.175, 0.885, 0.32, 1.18),
        opacity 0.4s ease, box-shadow 0.25s ease;
    }

    .memory-card.visible {
      opacity: 1;
      transform: translateY(0) rotate(var(--rotate, 0deg));
    }

    .memory-card:hover {
      transform: translateY(-8px) scale(1.045) rotate(var(--rotate, 0deg));
      box-shadow:
        0 30px 70px rgba(20, 0, 8, 0.55),
        0 0 34px rgba(255, 36, 84, 0.48);
    }

    .memory-card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(110deg, transparent 8%, rgba(255, 255, 255, 0.18) 20%, transparent 32%),
        linear-gradient(to bottom, transparent 55%, rgba(23, 0, 9, 0.34));
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .memory-card:hover::after {
      opacity: 1;
    }

    .memory-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
      background: rgba(255, 255, 255, 0.18);
    }

    .memory-card:hover .memory-img {
      transform: scale(1.08);
    }

    .memory-caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -100%;
      max-height: 78%;
      overflow-y: auto;
      padding: 1rem;
      color: white;
      white-space: pre-line;
      line-height: 1.45;
      font-size: 1rem;
      background: linear-gradient(180deg, rgba(255, 45, 91, 0.94), rgba(103, 0, 31, 0.96));
      text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.25);
      transition: bottom 0.35s ease;
      z-index: 4;
    }

    .memory-card:hover .memory-caption,
    .memory-card:focus-within .memory-caption {
      bottom: 0;
    }

    .card-tape {
      position: absolute;
      top: -15px;
      left: 50%;
      width: 100px;
      height: 35px;
      z-index: 2;
      transform: translateX(-50%) rotate(var(--tape-rotate, 2deg));
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.88), rgba(255, 210, 220, 0.68));
      box-shadow: 0 0 18px rgba(255, 56, 91, 0.24);
    }

    .card-sticker {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 3;
      width: 42px;
      height: 42px;
      transform: rotate(15deg);
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.32));
      animation: bounce 2s infinite;
    }

    .sticker {
      position: fixed;
      width: 60px;
      height: 60px;
      z-index: 3;
      pointer-events: none;
      filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.25));
      animation: float 3s ease-in-out infinite;
    }

    .sticker1 { top: 10%; left: 5%; }
    .sticker2 { right: 5%; bottom: 15%; animation-delay: 0.4s; }
    .sticker3 { bottom: 30%; left: 10%; animation-delay: 0.8s; }
    .sticker4 { top: 20%; right: 10%; animation-delay: 1.2s; }

    .balloon {
      position: fixed;
      width: 60px;
      height: 70px;
      z-index: -1;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffd6df, #ff214f 48%, #96002a);
      box-shadow: inset -5px -5px 0 rgba(0, 0, 0, 0.1);
      animation: floatUp 15s linear infinite;
    }

    .balloon::before {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      width: 2px;
      height: 80px;
      background: rgba(0, 0, 0, 0.2);
    }

    @keyframes floatUp {
      from { transform: translateY(100vh) rotate(0deg); opacity: 1; }
      to { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(5deg); }
    }

    @keyframes bounce {
      0%, 100% { transform: scale(1) rotate(15deg); }
      50% { transform: scale(1.18) rotate(20deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes headerGlow {
      0%, 100% {
        box-shadow:
          0 24px 80px rgba(20, 0, 8, 0.42),
          0 0 26px rgba(255, 35, 80, 0.18),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
      }
      50% {
        box-shadow:
          0 28px 90px rgba(20, 0, 8, 0.52),
          0 0 46px rgba(255, 50, 92, 0.34),
          inset 0 1px 0 rgba(255, 255, 255, 0.22);
      }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    @keyframes shine {
      0% { left: -100%; opacity: 0; }
      20% { left: 100%; opacity: 0.55; }
      100% { left: 100%; opacity: 0; }
    }

    @keyframes heartbeat {
      0%, 50%, 100% { transform: scale(1); }
      25%, 75% { transform: scale(1.04); }
    }

    @keyframes floatDown {
      from { transform: translateY(-10px) rotate(0deg); opacity: 1; }
      to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }

    @media (max-width: 768px) {
      .memory-lane-container { padding: 1.5rem 1rem; }
      .memory-card { width: 250px; height: 330px; }
      .gallery { gap: 1rem; }
      .sticker { width: 45px; height: 45px; }
    }

    @media (max-width: 480px) {
      .header p { font-size: 0.98rem; }
      .memory-card { width: 220px; height: 300px; }
      .navigation-buttons {
        flex-direction: column;
        align-items: center;
      }
      .btn,
      .nav-btn {
        width: min(100%, 220px);
      }
    }
  </style>
</head>

    function initFireworks() {
      const canvas = document.getElementById("fireworksCanvas");
      const ctx = canvas.getContext("2d");
      const colors = ["#fff1f4", "#ff2d5d", "#ff6b7b", "#ffd166", "#ff9db1"];
      const particles = [];
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (reducedMotion) return;

      function resizeCanvas() {
        canvas.width = window.innerWidth * window.devicePixelRatio;
        canvas.height = window.innerHeight * window.devicePixelRatio;
        ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
      }

      function launchFirework(x, y, size) {
        const particleCount = Math.floor(42 + Math.random() * 34);
        const color = colors[Math.floor(Math.random() * colors.length)];

        for (let i = 0; i < particleCount; i += 1) {
          const angle = (Math.PI * 2 * i) / particleCount;
          const speed = (Math.random() * 2.4 + 1.4) * size;

          particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            decay: Math.random() * 0.012 + 0.012,
            color,
            radius: Math.random() * 1.8 + 1.1,
            sparkle: Math.random() > 0.58,
          });
        }
      }

      function autoLaunch() {
        launchFirework(
          window.innerWidth * (0.16 + Math.random() * 0.68),
          window.innerHeight * (0.12 + Math.random() * 0.36),
          Math.random() * 0.65 + 0.8
        );
      }

      function animate() {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        ctx.globalCompositeOperation = "lighter";

        for (let i = particles.length - 1; i >= 0; i -= 1) {
          const p = particles[i];

          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.988;
          p.vy = p.vy * 0.988 + 0.018;
          p.life -= p.decay;

          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }

          ctx.globalAlpha = Math.max(p.life, 0);
          ctx.beginPath();
          ctx.fillStyle = p.color;
          ctx.shadowBlur = p.sparkle ? 18 : 10;
          ctx.shadowColor = p.color;
          ctx.arc(p.x, p.y, p.radius * p.life, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        requestAnimationFrame(animate);
      }

      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);
      setInterval(autoLaunch, 1200);
      setTimeout(autoLaunch, 250);
      setTimeout(autoLaunch, 850);
      animate();
    }

    function createConfetti() {
      const confettiContainer = document.getElementById("confetti-container");
      const colors = ["#ff2d5d", "#d00032", "#ff7a76", "#ffd166", "#fff1f4"];

      for (let i = 0; i < 100; i += 1) {
        const confetti = document.createElement("div");
        const duration = Math.random() * 3 + 3;
        const delay = Math.random() * 5;

        confetti.className = "confetti-piece";
        confetti.style.left = `${Math.random() * 100}vw`;
        confetti.style.width = `${Math.random() * 15 + 5}px`;
        confetti.style.height = `${Math.random() * 15 + 5}px`;
        confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.borderRadius = Math.random() > 0.5 ? "50%" : "0";
        confetti.style.animation = `floatDown ${duration}s ease-in ${delay}s infinite`;
        confetti.style.opacity = String(Math.random());

        confettiContainer.appendChild(confetti);
      }
    }

    function createMemoryCard(memory, index) {
      const memoryCard = document.createElement("article");
      memoryCard.className = "memory-card";
      memoryCard.style.setProperty("--rotate", `${memory.rotationAngle}deg`);
      memoryCard.style.setProperty("--tape-rotate", `${memory.rotationAngle * 2}deg`);
      memoryCard.style.transitionDelay = `${index * 80}ms`;

      const tapeElement = document.createElement("div");
      tapeElement.className = "card-tape";

      const imgElement = document.createElement("img");
      imgElement.className = "memory-img";
      imgElement.src = memory.image;
      imgElement.alt = `Memory ${index + 1}`;
      imgElement.loading = "lazy";

      const captionElement = document.createElement("div");
      captionElement.className = "memory-caption";
      captionElement.textContent = memory.caption;

      const stickerElement = document.createElement("div");
      stickerElement.className = "card-sticker";
      stickerElement.innerHTML = `
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="50" cy="50" r="50" fill="#d00032"></circle>
          <text x="50" y="65" font-family="Arial" font-size="40" text-anchor="middle" fill="white">${memory.emoji}</text>
        </svg>
      `;

      memoryCard.append(tapeElement, imgElement, captionElement, stickerElement);
      return memoryCard;
    }

    document.addEventListener("DOMContentLoaded", () => {
      initFireworks();
      createConfetti();

      const galleryElement = document.getElementById("memoryGallery");
      const startSlideshowBtn = document.getElementById("startSlideshow");
      const pauseSlideshowBtn = document.getElementById("pauseSlideshow");
      const backButton = document.getElementById("backButton");
      const nextButton = document.getElementById("nextButton");

      memories.forEach((memory, index) => {
        galleryElement.appendChild(createMemoryCard(memory, index));
      });

      const cards = Array.from(galleryElement.querySelectorAll(".memory-card"));
      let slideshowInterval = null;
      let currentSlide = 0;

      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("visible");
              observer.unobserve(entry.target);
            }
          });
        },
        { threshold: 0.25 }
      );

      cards.forEach((card, index) => {
        observer.observe(card);
        setTimeout(() => card.classList.add("visible"), 400 + index * 120);
      });

      function scrollToSlide(index) {
        const card = cards[index];
        if (!card) return;

        galleryElement.scrollTo({
          left: card.offsetLeft - galleryElement.clientWidth / 2 + card.clientWidth / 2,
          behavior: "smooth",
        });
      }

      function startSlideshow() {
        startSlideshowBtn.hidden = true;
        pauseSlideshowBtn.hidden = false;
        clearInterval(slideshowInterval);

        slideshowInterval = setInterval(() => {
          currentSlide = (currentSlide + 1) % cards.length;
          scrollToSlide(currentSlide);
        }, 2500);
      }

      function pauseSlideshow() {
        pauseSlideshowBtn.hidden = true;
        startSlideshowBtn.hidden = false;
        clearInterval(slideshowInterval);
        slideshowInterval = null;
      }

      startSlideshowBtn.addEventListener("click", startSlideshow);
      pauseSlideshowBtn.addEventListener("click", pauseSlideshow);

      backButton.addEventListener("click", () => {
        window.location.href = previousPage;
      });

      nextButton.addEventListener("click", () => {
        window.location.href = nextPage;
      });
    });
  </script>
</body>
</html>
